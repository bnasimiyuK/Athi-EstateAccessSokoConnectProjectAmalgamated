<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Categories — Super Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="icon" href="data:,">
</head>
<body>

<main class="container" style="padding: 40px 24px;">

  <!-- ================= PAGE HEAD ================= -->
  <div class="page-head" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
    <div>
      <h1>Manage categories</h1>
      <p>Add, edit, or remove service categories. Paste any emoji as the icon.</p>
    </div>
    <button id="btn-new-category" class="btn btn--accent" type="button">
      <i class="fas fa-plus"></i> New category
    </button>
  </div>

  <!-- ================= LIST ================= -->
  <div id="categories-list"></div>

</main>

<!-- ============================================================
     ADD / EDIT MODAL
     ============================================================ -->
<div id="cat-modal-backdrop"
     style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5);
            z-index:1000; align-items:center; justify-content:center; padding:20px;">

  <div style="background:#fff; border-radius:10px; padding:24px;
              width:min(460px, 100%); box-shadow:0 10px 40px rgba(0,0,0,0.2);">

    <h3 id="cat-modal-title" style="margin-top:0;">New category</h3>

    <!-- Label -->
    <div class="field" style="margin-bottom:14px;">
      <label for="cat-label">Label</label>
      <input type="text"
             id="cat-label"
             placeholder="e.g. Plumbing"
             style="width:100%; padding:10px 12px;
                    border:1px solid var(--line, #dcd8cd);
                    border-radius:6px; font-size:1rem;" />
    </div>

    <!-- Icon (text input only, no hardcoded emoji) -->
    <div class="field" style="margin-bottom:8px;">
      <label for="cat-icon">Icon (emoji)</label>
      <div style="display:flex; gap:8px; align-items:stretch;">
        <input type="text"
               id="cat-icon"
               placeholder="🔧"
               style="flex:1; padding:10px 12px;
                      border:1px solid var(--line, #dcd8cd);
                      border-radius:6px; font-size:1.4rem;
                      text-align:center;
                      font-family: 'Segoe UI Emoji', 'Apple Color Emoji',
                                   'Noto Color Emoji', sans-serif;" />
        <button type="button"
                id="cat-icon-clear"
                class="btn btn--ghost btn--small"
                style="min-width:70px;">Clear</button>
      </div>
      <small style="color:var(--ink-70, #4a5670); display:block;
                    margin-top:6px; line-height:1.5;">
        Paste any emoji you like. Sources:
        <a href="https://getemoji.com/" target="_blank" rel="noopener">getemoji.com</a>,
        <a href="https://emojipedia.org/" target="_blank" rel="noopener">emojipedia.org</a>,
        or copy from your phone&rsquo;s keyboard.
      </small>
    </div>

    <!-- Actions -->
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
      <button type="button" id="cat-cancel" class="btn btn--ghost">Cancel</button>
      <button type="button" id="cat-save" class="btn btn--accent">Save</button>
    </div>

  </div>
</div>

<!-- ============================================================
     SCRIPTS (order matters)
     ============================================================ -->
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/super-admin.js"></script>

</body>
</html>
