<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forgot password — Athi Soko</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="icon" href="data:,">
</head>
<body>
<main class="container" style="padding: 60px 24px; display:flex; justify-content:center;">
<div class="register-container" style="max-width:480px;">
<div class="register-header">
<span class="role-badge"><i class="fas fa-key"></i> PASSWORD RESET</span>
<h1><i class="fas fa-unlock-alt"></i> Forgot your password?</h1>
<p>Enter your email and role. We will send a reset link.</p>
</div>
<form id="forgotForm">
<div class="input-group">
<label for="email"><i class="fas fa-envelope"></i> Email address</label>
<input type="email" id="email" required placeholder="you@example.com" />
</div>
<div class="input-group">
<label for="role"><i class="fas fa-user-tag"></i> Account type</label>
<select id="role" required>
<option value="resident">Resident</option>
<option value="vendor">Vendor</option>
<option value="admin">Admin</option>
<option value="super-admin">Super Admin</option>
<option value="security">Security</option>
</select>
</div>
<div class="actions" style="margin-top:24px;">
<button type="submit" class="btn-primary" id="submitBtn" style="width:100%;">
<i class="fas fa-paper-plane"></i> Send reset link
</button>
</div>
</form>
<div id="msgBox" class="backend-message hidden" style="margin-top:16px;">
<i class="fas fa-info-circle"></i>
<span id="msgText"></span>
</div>
<div class="login-link" style="margin-top:20px;">
<a href="login.html">&larr; Back to login</a>
</div>
</div>
</main>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const email = document.getElementById("email").value.trim();
  const role  = document.getElementById("role").value;
  btn.disabled = true;
  showMsg("Sending reset link…", false);
  try {
    const res = await fetch(API_BASE + "/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, role }),
    });
    if (!res.ok) {
      const t = await res.text().catch(() => "");
      throw new Error(t || "Request failed");
    }
    showMsg("If that email is registered, a reset link has been sent.", false);
    document.getElementById("forgotForm").reset();
  } catch (err) {
    console.error(err);
    showMsg("Could not send reset link. Please try again.", true);
  } finally {
    btn.disabled = false;
  }
});
function showMsg(text, isError) {
  const box = document.getElementById("msgBox");
  const txt = document.getElementById("msgText");
  box.classList.remove("hidden");
  box.classList.toggle("error", !!isError);
  txt.textContent = text;
}
</script>
</body>
</html>
