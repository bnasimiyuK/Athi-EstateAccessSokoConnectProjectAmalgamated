  <script src="js/auth.js?v=8"></script>
  <script src="js/api.js?v=14"></script>
  <script src="js/main.js?v=11"></script>
  <script>
    (function () {
      const statusEl = document.getElementById("social-status");

      const hash = window.location.hash.slice(1);
      const params = new URLSearchParams(hash);
      const token = params.get("token");
      const userRaw = params.get("user");
      const err = params.get("error");

      if (err) {
        statusEl.textContent = "Sign-in failed: " + decodeURIComponent(err);
        setTimeout(() => (window.location.href = "login.html"), 2500);
        return;
      }

      if (!token || !userRaw) {
        statusEl.textContent = "Missing session data. Redirecting to login&hellip;";
        setTimeout(() => (window.location.href = "login.html"), 2000);
        return;
      }

      let user;
      try { user = JSON.parse(decodeURIComponent(userRaw)); }
      catch (e) {
        statusEl.textContent = "Bad session data. Redirecting to login&hellip;";
        setTimeout(() => (window.location.href = "login.html"), 2000);
        return;
      }

      saveSession(token, user);
      history.replaceState(null, "", "social-callback.html");

      if (user.role === "admin")       window.location.href = "admin.html";
      else if (user.role === "vendor") window.location.href = "provider-dashboard.html";
      else                             window.location.href = "dashboard.html";
    })();
  </script>
