<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Provider profile — AthiEstateAccessSokoConnectProjectAmalgamated</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="icon" href="data:,"> 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>

<main class="container" id="provider-root">
  <!-- filled by provider.js; shows an empty state if id is missing/invalid -->
</main>

<div class="modal-backdrop" id="report-modal">
  <div class="modal">
    <h3>Report this provider</h3>
    <p>Tell the estate admin what happened. This is logged for review, not resolved automatically.</p>
    <form id="report-form">
      <div class="field" style="margin-bottom:12px;">
        <label for="report-reason">What went wrong</label>
        <select id="report-reason">
          <option>Did not show up</option>
          <option>Poor quality work</option>
          <option>Overcharged / price dispute</option>
          <option>Unsafe or suspicious behaviour</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label for="report-details">Details</label>
        <textarea id="report-details" rows="4" required placeholder="What happened, and when?"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn--ghost" id="report-cancel">Cancel</button>
        <button type="submit" class="btn btn--danger">Submit report</button>
      </div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container" style="width:100%;">Verification confirms submitted details only — it is not a guarantee of work quality.</div>
</footer>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/provider.js"></script>
  <script src="js/sidebar.js"></script>
</body>
</html>
