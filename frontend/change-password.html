<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password · Athi Soko Connect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:,"> 
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">Athi Soko <span>Connect</span></a>
    <nav class="main-nav">
      <a href="index.html" data-nav="index.html">Discover</a>
      <a href="register.html" data-nav="register.html">Become a provider</a>
      <a href="dashboard.html" data-nav="dashboard.html">My bookings</a>
      <a href="residents.html" data-nav="residents.html">Sign Up</a>
    </nav>
  </div>
</header>

<main class="container" style="padding: 60px 24px; display:flex; justify-content:center;">
  <div class="register-container" style="max-width:520px;">

    <div class="register-header">
      <span class="role-badge"><i class="fas fa-shield-alt"></i> SECURITY</span>
      <h1>
        <i class="fas fa-key"></i>
        Change your password
      </h1>
      <p id="introText">You must set a new password before continuing.</p>
    </div>

    <!-- Notice box for first-login flow -->
    <div id="firstLoginNotice" class="notice" style="display:none; background: var(--amber-tint); color: var(--ochre-dark); border-color: #e8d4a4;">
      <i class="fas fa-exclamation-triangle"></i>
      This is your first login. Please set a permanent password to continue.
    </div>

    <form id="changePasswordForm" novalidate>

      <!-- Current password -->
      <div class="input-group">
        <label for="currentPassword">
          <i class="fas fa-lock"></i> Current password
        </label>
        <input type="password"
               id="currentPassword"
               placeholder="Enter your temporary password"
               autocomplete="current-password"
               required />
      </div>

      <!-- New password -->
      <div class="input-group">
        <label for="newPassword">
          <i class="fas fa-key"></i> New password
        </label>
        <input type="password"
               id="newPassword"
               placeholder="Create a new password"
               autocomplete="new-password"
               required />
        <div class="password-hint">
          Min 8 characters · at least 1 uppercase, 1 lowercase, 1 number
        </div>
      </div>

      <!-- Confirm new password -->
      <div class="input-group">
        <label for="confirmPassword">
          <i class="fas fa-check-circle"></i> Confirm new password
        </label>
        <input type="password"
               id="confirmPassword"
               placeholder="Re-enter new password"
               autocomplete="new-password"
               required />
      </div>

      <div class="actions" style="margin-top:24px;">
        <button type="submit" class="btn-primary" id="submitBtn" style="width:100%;">
          <i class="fas fa-save"></i> Save new password
        </button>
      </div>
    </form>

    <div id="cpMessage" class="backend-message hidden" style="margin-top:16px;">
      <i class="fas fa-info-circle"></i>
      <span id="cpMessageText"></span>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/change-password.js"></script>
</body>
</html>
